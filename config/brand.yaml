# Identidade, temas e tom de voz. A IA usa este ficheiro em TODAS as gerações.

owner: "David Carreto"
company: "Carretos Group"
workshops_count: 5
workshops: ["Almada", "Cacém", "Lisboa", "Mafra", "Santarém"]
language: "pt-PT"
specialty: "Reparação e manutenção automóvel especializada em Mercedes-Benz"

# Pilares de conteúdo (o plano distribui as publicações por estes temas)
pillars:
  - id: mercedes_tecnico
    name: "Reparação Mercedes"
    description: "Diagnósticos, avarias típicas por modelo/motor (OM651, OM654, M274, 7G/9G-Tronic, AIRMATIC...), antes/depois, dicas de manutenção, curiosidades técnicas."
  - id: carretos_group
    name: "Carretos Group e as 5 oficinas"
    description: "Bastidores das oficinas, equipamentos, processos, novidades, abertura/crescimento, clientes satisfeitos."
  - id: pessoas
    name: "Pessoas"
    description: "A equipa, mecânicos, histórias de colaboradores, recrutamento, formação, clientes."
  - id: lideranca
    name: "Liderança"
    description: "Lições de gestão, decisões difíceis, cultura de empresa, como liderar 5 oficinas, rotinas do David."
  - id: conquistas
    name: "Conquistas"
    description: "Marcos atingidos, prémios, números, carros difíceis resolvidos, momentos de orgulho."
  - id: auron
    marca: auron            # só para as contas da AURON (não aparece nas outras)
    name: "AURON"
    description: "Conteúdos da marca AURON, só com base nos factos e no tom definidos para a AURON."
  - id: dificuldades
    name: "Dificuldades"
    description: "Falhas, erros, momentos duros, o que correu mal e o que se aprendeu. Vulnerabilidade autêntica."

# Tom por tipo de conta
voices:
  pessoal: "Primeira pessoa (eu), autêntico, próximo, direto, com emoção e histórias reais. Partilha bastidores e reflexões."
  marca: "Carreto Clips: energia alta, ganchos fortes nos primeiros 2 segundos, curto, visual, técnico mas acessível, humor leve."
  empresa: "Carretos Group: profissional, credível, nós (equipa), foco em qualidade, confiança e especialização Mercedes."
  auron: "AURON: tom por definir pelo David (dashboard → Factos → AURON). Até lá: neutro, profissional, frases curtas."

# Termos que NÃO podem aparecer nas legendas (fora de links). Bloqueiam a aprovação e a publicação.
#   todas: em todas as marcas (fornecedores/sistemas internos, funcionalidades ainda não lançadas). Deixam de
#          ser bloqueados numa marca se o David os acrescentar aos factos dessa marca.
#   geral: só nas contas do David e da Carretos Group (o nome AURON é só das contas da AURON)
termos_proibidos:
  todas: ["OfficeGest", "Typs4y", "Inovcorp", "TecAlliance", "Carretos Care"]
  geral: ["AURON"]

# Marcas com factos e tom próprios (o grupo indica-a em accounts.yaml → groups → facts)
marcas:
  auron:
    nome: "AURON"

rules:
  - "Nunca inventar números, prémios, nomes de clientes ou factos. Se faltar informação, deixar [PREENCHER]."
  - "Afirmações sobre a vida, a experiência, as histórias ou as opiniões vividas do David (ex.: 'aprendi isto na oficina', 'estas frases não são de nenhum livro', 'quando comecei…') também são factos: só se estiverem nos FACTOS CONFIRMADOS; senão [PREENCHER: …] ou, melhor, escrever sem as afirmar."
  - "Não usar o logótipo Mercedes-Benz como se fôssemos representantes oficiais; dizer 'especialistas em Mercedes'."
  - "Nunca publicar informação interna: fornecedores e sistemas internos (OfficeGest, Typs4y, Inovcorp, TecAlliance), margens, diferenças de preço entre sistemas, nem funcionalidades ainda em desenvolvimento (peças equivalentes vs originais, Contratos de Serviço / Carretos Care+), a não ser que estejam nos factos."
  - "Português de Portugal (não brasileiro)."
  - "Cada publicação tem um gancho, valor e uma chamada à ação."

hashtags:
  base: ["#CarretosGroup", "#Mercedes", "#MercedesBenz", "#Oficina", "#MecanicaAutomovel", "#Portugal"]
  tecnico: ["#Diagnostico", "#AMG", "#Mecanico", "#CarRepair"]
  lideranca: ["#Lideranca", "#Empreendedorismo", "#Gestao", "#Equipa"]

visual:
  colors:
    primary: "#0B0B0D"      # preto
    secondary: "#C0C4C8"    # prata
    accent: "#00A3E0"       # azul elétrico
    text: "#FFFFFF"
  font_bold: "/usr/share/fonts/opentype/inter/Inter-ExtraBold.otf"
  font_regular: "/usr/share/fonts/opentype/inter/Inter-Medium.otf"
  logo: "assets/brand/logo.png"              # coloca aqui o logótipo (PNG transparente)
  intro_video: "assets/brand/intro.mp4"      # opcional
  outro_video: "assets/brand/outro.mp4"      # opcional
  music_dir: "assets/music"                  # músicas livres de direitos (opcional)

# Correções automáticas de erros do reconhecimento de voz nas legendas (palavra inteira, sem maiúsculas)
transcription_fixes:
  carreta: "Carreto"
  carretas: "Carretos"
  "carreto desgrupo": "Carretos Group"
  "carretos grupo": "Carretos Group"
  maceto: "Mercedes"
  mercedez: "Mercedes"

# Temas visuais por conta (accounts.yaml → theme). Sobrepõem-se a "visual".
themes:
  carretos: {}                               # azul da Carretos Group (o "visual" acima)
  auron:                                     # PROVISÓRIO: cores neutras até o David definir a identidade AURON
    signature: "AURON"
    quote_author: "AURON"                    # as frases assinam "AURON", não "David Carreto"
    colors:
      primary: "#0B0B0C"
      secondary: "#BFC4CC"
      accent: "#E6E8EB"
      text: "#FFFFFF"
    logo: ""
    carousel_cta: "Guarda e partilha"
    intro_video: ""
    outro_video: ""
  pessoal:                                   # redes pessoais do David: preto e dourado
    signature: "DAVID CARRETO"
    colors:
      primary: "#000000"
      secondary: "#CFCFCF"
      accent: "#D4AF37"                      # dourado
      text: "#FFFFFF"
    logo: ""                                 # sem logótipo da empresa: assinatura em texto
    carousel_cta: "Guarda e partilha com quem precisa de ler isto"
    intro_video: ""
    outro_video: ""

# Vozes da narração dos vídeos criados do zero. Cada conta escolhe a sua em accounts.yaml (narrator).
narrators:
  david:
    engine: conversion                       # a tua voz com sotaque PT-PT (gratuito, local)
    base_voice: pt_PT-tugão-medium           # voz que dá a pronúncia de Portugal
    sample: assets/voz/david_referencia.wav  # criado por: carretos voice-setup <gravação>
    language: pt
    exaggeration: 0.5    # 0.3 calmo … 0.8 enérgico
    cfg_weight: 0.5      # mais baixo = mais pausado e fiel ao ritmo da gravação
    temperature: 0.8
  david_clone:                               # clone direto (sotaque tende para o Brasil)
    engine: chatterbox
    sample: assets/voz/david_referencia.wav
    language: pt
  david_elevenlabs:                          # PAGO: clone profissional na ElevenLabs (inativo sem chave)
    engine: elevenlabs
    voice_id: ""                             # ou ELEVENLABS_VOICE_ID no .env
    model: eleven_multilingual_v2
    stability: 0.5
    similarity: 0.85
  generica:
    engine: piper
    voice: pt_PT-tugão-medium
