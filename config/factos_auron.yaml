# Tom de comunicação da AURON (editável no dashboard → Factos → AURON)
tom: >-
  Claro, direto e prático. Fala com donos de Mercedes-Benz que querem saber quanto custa a revisão sem
  telefonar nem esperar por orçamento. Mensagem principal: "Sabe o preço da sua revisão na hora e marque online."
  Frases curtas, linguagem simples, sem termos técnicos desnecessários. Tratar o cliente por "você" (ou sem
  pronome). Transmitir transparência (preço linha a linha, sem surpresas), rapidez e confiança, com um toque
  premium (Mercedes-Benz). Terminar sempre com chamada à ação para auron.carretos.pt/schedule. Não indicar
  preços concretos de revisões, nem promoções que não estejam nos factos, nem falar do David em nome pessoal.
