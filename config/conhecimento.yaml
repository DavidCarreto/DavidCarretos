# BASE DE CONHECIMENTO INICIAL (fichas de partida).
# O que vale é o que está no dashboard → Conhecimento (guardado na base de dados do servidor).
# Este ficheiro só serve para:
#   - criar as fichas da 1.ª vez;
#   - propor fichas NOVAS nas atualizações (o dashboard pergunta antes de as acrescentar).
# Cada ficha tem uma "chave" fixa (não mudar), para o sistema saber se já foi acrescentada ou apagada.
#
# marca:   geral (David Carreto + Carretos Group) | auron | todas (vale para todas as marcas)
# secao:   empresa | servicos | condicoes | contactos | pessoas | conquistas | faq | regras | outros
# estado:  publicavel (a IA pode usar) | interno (nunca se publica) | desenvolvimento (ainda não se publica)
# funcao:  (contactos) cta = chamada à ação principal | alternativa | duvidas | info
# palavras: (interno/desenvolvimento) palavras que, se aparecerem numa legenda, bloqueiam a aprovação

marcas:
  geral:
    tom: >-
      Quando falar de revisões, destacar o benefício: saber o preço na hora e marcar sem esperas.
      A chamada à ação principal é o WhatsApp 211 45 46 46 (assistente disponível 24 horas que dá o preço
      da revisão, explica o orçamento e os serviços e faz a marcação); o link de marcação online é a
      alternativa para quem prefere fazer sozinho. NUNCA mencionar o nome "AURON" nas contas do David nem
      da Carretos Group.
    proibidas: ["AURON"]
  auron:
    tom: >-
      Claro, direto e prático. Fala com donos de Mercedes-Benz que querem saber quanto custa a revisão sem
      telefonar nem esperar por orçamento. Mensagem principal: "Sabe o preço da sua revisão na hora e marque
      online." Frases curtas, linguagem simples, sem termos técnicos desnecessários. Tratar o cliente por
      "você" (ou sem pronome). Transmitir transparência (preço linha a linha, sem surpresas), rapidez e
      confiança, com um toque premium (Mercedes-Benz). Terminar sempre com chamada à ação para
      auron.carretos.pt/schedule. Não indicar preços concretos de revisões, nem promoções que não estejam
      nos factos, nem falar do David em nome pessoal.
    proibidas: []

