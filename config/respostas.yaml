# Regras gerais
estrelas_minimas: 4              # responde a 4 e 5 estrelas
dias_maximos: null               # null = responde a TODAS as avaliações por responder, incluindo as antigas
max_respostas_por_execucao: 25   # travão de segurança: as antigas vão sendo respondidas ao longo das execuções

# Alertas para avaliações de 1-3 estrelas por responder: abre um "issue" no GitHub para cada
# uma, atribuído ao dono do repositório (o GitHub envia email). O alerta fecha-se sozinho
# quando a avaliação for respondida no Google.
alertas: true

# "modelos" = textos fixos abaixo (gratuito)
# "ia"      = resposta personalizada escrita pelo Claude (precisa de ANTHROPIC_API_KEY);
#             se a IA falhar, usa os modelos como reserva.
modo: ia

# Instruções de estilo para o modo "ia"
estilo_ia: |
  Escreves em português de Portugal, em nome da equipa da oficina.
  Tom simpático, profissional e próximo, tratando o cliente por "você" (ou sem pronome).
  NUNCA deduzas o género do cliente pelo nome. Não uses pronomes nem formas que o revelem
  ("vê-lo", "vê-la", "recebê-lo", "satisfeito/a", "bem-vindo/a").
  Errado: "esperamos voltar a vê-lo em breve". Certo: "esperamos voltar a contar com a sua visita".
  Errado: "ficou satisfeita". Certo: "ainda bem que gostou do serviço".
  Respostas curtas: 2 a 4 frases. Agradece, refere de forma natural algo concreto que o
  cliente mencionou (se mencionou), e convida a voltar.
  Somos oficinas especialistas Mercedes-Benz.
  Nunca inventes factos, promoções, preços, nomes de funcionários ou serviços que o cliente
  não referiu. Não incluas links, emails nem números de telefone. Não uses emojis.
  Se a avaliação estiver noutra língua, responde nessa língua.
assinatura: "Equipa {oficina}"

# Modelos de resposta. Variáveis: {saudacao} ("Olá João," ou "Olá,") e {oficina}.
# É escolhida uma variante diferente para cada avaliação.
modelos:
  5:
    com_comentario:
      - "{saudacao} muito obrigado pela sua avaliação de 5 estrelas e pelas palavras simpáticas! Ficamos muito contentes por saber que gostou do nosso serviço. Estaremos sempre ao dispor para cuidar do seu Mercedes."
      - "{saudacao} agradecemos imenso o seu comentário! É para nós um orgulho saber que a experiência na {oficina} correu bem. Contamos consigo numa próxima visita."
      - "{saudacao} obrigado pela confiança e pela excelente avaliação! O seu feedback motiva toda a equipa a continuar a dar o melhor. Até breve!"
    sem_comentario:
      - "{saudacao} muito obrigado pela avaliação de 5 estrelas! Ficamos muito felizes por saber que gostou. Até à próxima!"
      - "{saudacao} agradecemos a sua confiança e as 5 estrelas! Estaremos sempre ao dispor na {oficina}."
  4:
    com_comentario:
      - "{saudacao} muito obrigado pela sua avaliação e pelo comentário! Ficamos contentes por ter gostado do nosso serviço e trabalhamos todos os dias para que a próxima experiência seja ainda melhor."
      - "{saudacao} agradecemos o seu feedback! É muito importante para nós. Esperamos voltar a contar com a sua visita na {oficina}."
    sem_comentario:
      - "{saudacao} obrigado pela sua avaliação! Ficamos contentes por saber que gostou e esperamos voltar a contar com a sua visita."
      - "{saudacao} agradecemos as 4 estrelas e a sua confiança na {oficina}. Até breve!"
