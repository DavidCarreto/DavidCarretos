# Contas geridas pelo sistema.
# As credenciais NUNCA ficam aqui: cada conta indica o nome das variáveis de ambiente
# (ficheiro .env) de onde o token é lido.
#
# publish_mode:
#   auto    -> publica sozinho na hora agendada (depois de aprovado, ou logo, se auto_approve)
#   assist  -> a plataforma não permite publicação por API; o sistema prepara tudo
#              (vídeo, capa, legenda) e envia-te um lembrete para publicares em 1 toque.

# group: a que grupo pertence a conta (define as duas tabelas de permissões na página "Equipa")
#   david     -> "Redes do David Carreto" (pessoais + Carreto Clips)
#   carretos  -> "Redes da Carretos Group" (empresa)
#   auron     -> "Redes da AURON" (marca à parte; portefólio Meta "RibaMotor")
# facts (no grupo): que lista de factos e tom a IA usa ("geral" = David + Carretos Group; "auron" = só AURON)
# status: "por_ligar" enquanto não houver handle/tokens (o sistema não publica nestas contas)
groups:
  - id: david
    name: "Redes do David Carreto"
    short: "David Carreto"
  - id: carretos
    name: "Redes da Carretos Group"
    short: "Carretos Group"
  - id: auron
    name: "Redes da AURON"
    short: "AURON"
    facts: auron              # factos e tom próprios (não se misturam com os da Carretos Group)

accounts:
  - id: ig_davidcarreto
    group: david
    platform: instagram
    name: "David Carreto (Instagram pessoal)"
    handle: "davidcarretos"
    voice: pessoal          # pessoal | marca | empresa
    narrator: david_elevenlabs  # a tua voz (ElevenLabs); sem chave/Voice ID configurados sai sem narração
    theme: pessoal          # identidade: pessoal (preto e dourado, "DAVID CARRETO") | carretos (azul)
    publish_mode: auto
    auto_approve: false     # true = publica sem pedir a tua aprovação
    credentials:
      access_token_env: IG_DAVIDCARRETO_TOKEN
      user_id_env: IG_DAVIDCARRETO_USER_ID

  - id: ig_carretoclips
    group: david
    platform: instagram
    name: "Carreto Clips (Instagram)"
    handle: "carretoclips"
    voice: marca
    narrator: generica           # voz da narração: david | generica
    publish_mode: auto
    auto_approve: false
    credentials:
      access_token_env: IG_CARRETOCLIPS_TOKEN
      user_id_env: IG_CARRETOCLIPS_USER_ID

  - id: fb_davidcarreto
    group: david
    platform: facebook_profile
    name: "David Carreto (Facebook pessoal)"
    handle: "davidcarreto"
    voice: pessoal
    narrator: david_elevenlabs  # a tua voz (ElevenLabs); sem chave/Voice ID configurados sai sem narração
    theme: pessoal          # identidade: pessoal (preto e dourado, "DAVID CARRETO") | carretos (azul)
    # A Meta não permite publicar em perfis pessoais por API desde 2018.
    publish_mode: assist
    auto_approve: false
    credentials: {}

  - id: tt_davidcarreto
    group: david
    platform: tiktok
    name: "David Carreto (TikTok pessoal)"
    handle: "davidcarretos"
    voice: pessoal
    narrator: david_elevenlabs  # a tua voz (ElevenLabs); sem chave/Voice ID configurados sai sem narração
    theme: pessoal          # identidade: pessoal (preto e dourado, "DAVID CARRETO") | carretos (azul)
    publish_mode: auto
    auto_approve: false
    credentials:
      access_token_env: TT_DAVIDCARRETO_TOKEN
      refresh_token_env: TT_DAVIDCARRETO_REFRESH     # o token da TikTok dura 24 h: é renovado sozinho

  - id: tt_carretoclips
    group: david
    platform: tiktok
    name: "Carreto Clips (TikTok)"
    handle: "clips.do.carreto"
    voice: marca
    narrator: generica           # voz da narração: david | generica
    publish_mode: auto
    auto_approve: false
    credentials:
      access_token_env: TT_CARRETOCLIPS_TOKEN
      refresh_token_env: TT_CARRETOCLIPS_REFRESH     # o token da TikTok dura 24 h: é renovado sozinho

  - id: li_davidcarreto
    group: david
    platform: linkedin_member
    name: "David Carreto (LinkedIn pessoal)"
    handle: "davidcarreto"
    voice: pessoal
    narrator: david_elevenlabs  # a tua voz (ElevenLabs); sem chave/Voice ID configurados sai sem narração
    theme: pessoal          # identidade: pessoal (preto e dourado, "DAVID CARRETO") | carretos (azul)
    publish_mode: auto
    auto_approve: false
    credentials:
      access_token_env: LI_DAVIDCARRETO_TOKEN
      author_urn_env: LI_DAVIDCARRETO_URN        # urn:li:person:XXXX

  - id: li_carretosgroup
    group: carretos
    platform: linkedin_org
    name: "Carretos Group (LinkedIn empresa)"
    handle: ""                # por preencher (o David indica)
    # modo assistido até o LinkedIn aprovar a Community Management API (ver docs/GUIA_LINKEDIN.md)
    voice: empresa
    narrator: generica      # voz: david | generica | nenhum
    theme: carretos         # identidade: pessoal (preto e dourado) | carretos (azul)
    publish_mode: auto
    auto_approve: false
    credentials:
      access_token_env: LI_CARRETOSGROUP_TOKEN
      author_urn_env: LI_CARRETOSGROUP_URN       # urn:li:organization:XXXX

