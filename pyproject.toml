[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carretos-social"
version = "0.1.0"
description = "Análise, criação, edição e publicação automática de conteúdos para as redes sociais de David Carreto e da Carretos Group"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.8",
  "requests>=2.31",
  "PyYAML>=6",
  "Pillow>=10",
  "numpy>=1.26",
  "piper-tts>=1.2",
  "faster-whisper>=1.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
carretos = "carretos_social.cli:main"

[tool.setuptools.packages.find]
include = ["carretos_social*"]
