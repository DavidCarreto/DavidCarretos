[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carretos-social"
version = "0.1.0"
description = "Análise, criação, edição e publicação automática de conteúdos para as redes sociais de David Carreto e da Carretos Group"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.8",
  "requests>=2.31",
  "PyYAML>=6",
  "Pillow>=10",
  "numpy>=1.26",
  "piper-tts>=1.2",
  "faster-whisper>=1.0",
  "opencv-python-headless>=4.8,<5",   # deteção de rosto (texto fora da cara)
  "soundfile>=0.12",
  # dashboard
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "itsdangerous>=2.1",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
# clone de voz local (Chatterbox): opcional e pesado; a voz em produção vem da ElevenLabs.
# Atenção: no Ubuntu 24.04 falha a compilar 'pkuseg'. Não instalar no servidor.
voz-local = ["chatterbox-tts>=0.1.7"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
carretos = "carretos_social.cli:main"

[tool.setuptools.packages.find]
include = ["carretos_social*"]
