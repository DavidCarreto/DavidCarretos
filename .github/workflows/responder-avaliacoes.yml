name: Responder avaliações Google

on:
  schedule:
    - cron: "17 7-22 * * *"   # de hora a hora, das 7h às 22h (UTC)
  push:   # na branch de desenvolvimento, cada envio só testa a IA (não usa o Google)
    branches: [claude/google-reviews-auto-response-f5f1ad]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar as respostas no Google? (não = modo teste)"
        type: boolean
        default: false
      testar_ia:
        description: "Só testar a IA com avaliações de exemplo (não usa o Google)"
        type: boolean
        default: false

concurrency:
  group: responder-avaliacoes
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # para criar os alertas de avaliações negativas

jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Responder
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
          # Execução manual: segue a opção escolhida.
          # Execução agendada: só publica se a variável PUBLICAR_AUTOMATICO = true.
          PUBLICAR: ${{ github.event_name == 'workflow_dispatch' && inputs.publicar || github.event_name == 'schedule' && vars.PUBLICAR_AUTOMATICO == 'true' }}
          TESTAR_IA: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.testar_ia }}
        run: |
          if [ "$TESTAR_IA" = "true" ]; then
            python -m avaliacoes.main --testar-ia
          elif [ "$PUBLICAR" = "true" ]; then
            python -m avaliacoes.main --publicar
          else
            python -m avaliacoes.main
          fi
